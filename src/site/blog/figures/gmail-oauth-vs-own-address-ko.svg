<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="fig-a-title fig-a-desc" font-family="inherit" fill="none" stroke="currentColor">
  <title id="fig-a-title">OAuth로 연결한 내 Gmail과 에이전트 자기 주소 비교</title>
  <desc id="fig-a-desc">왼쪽: OAuth로 내 Gmail에 연결한 에이전트는 메일함의 모든 메일을 읽고, 내 이름으로 아무 주소에나 보냅니다. 내 주소를 아는 누구나 에이전트 앞에 글을 놓을 수 있고, 에이전트가 보낸 메일은 내 보낸편지함에 섞입니다. 오른쪽: 자기 주소 scout@atmark.ai를 가진 에이전트는 그 주소로 온 메일만 읽고, 발신 허용 목록에 있는 상대에게만 자기 이름으로 보냅니다. 받은 메일은 외부 데이터로 표시되어 도착하고, 모든 판정은 해시 체인 로그에 남습니다. 내 메일함은 연결되지 않습니다.</desc>

  <!-- Left panel -->
  <text x="184" y="30" fill="currentColor" stroke="none" font-size="16" font-weight="600" text-anchor="middle">OAuth로 연결한 내 Gmail</text>
  <rect x="124" y="48" width="120" height="36" rx="6" stroke-width="1.5"/>
  <text x="184" y="71" fill="currentColor" stroke="none" font-size="14" text-anchor="middle">에이전트</text>
  <line x1="184" y1="84" x2="184" y2="112" stroke-width="1.5"/>
  <path d="M178 106 L184 114 L190 106" stroke-width="1.5"/>
  <rect x="16" y="116" width="336" height="216" rx="8" stroke-width="1.5"/>
  <text x="184" y="142" fill="currentColor" stroke="none" font-size="14" font-weight="600" text-anchor="middle">you@gmail.com</text>
  <line x1="32" y1="156" x2="336" y2="156" stroke-width="1" opacity=".4"/>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="32" y="184"><tspan font-weight="600">읽기</tspan>  메일함의 모든 메일</text>
    <text x="32" y="220"><tspan font-weight="600">발신</tspan>  내 이름으로, 아무 주소에나</text>
    <text x="32" y="256"><tspan font-weight="600">수신</tspan>  내 주소를 아는 누구에게서나</text>
    <text x="32" y="292"><tspan font-weight="600">기록</tspan>  보낸편지함, 내가 쓴 메일과 섞임</text>
  </g>

  <!-- Divider -->
  <line x1="360" y1="20" x2="360" y2="380" stroke-width="1" stroke-dasharray="4 6" opacity=".4"/>

  <!-- Right panel -->
  <text x="536" y="30" fill="currentColor" stroke="none" font-size="16" font-weight="600" text-anchor="middle">에이전트 자기 주소</text>
  <rect x="476" y="48" width="120" height="36" rx="6" stroke-width="1.5"/>
  <text x="536" y="71" fill="currentColor" stroke="none" font-size="14" text-anchor="middle">에이전트</text>
  <line x1="536" y1="84" x2="536" y2="112" stroke-width="1.5"/>
  <path d="M530 106 L536 114 L542 106" stroke-width="1.5"/>
  <rect x="368" y="116" width="336" height="216" rx="8" stroke-width="1.5"/>
  <text x="536" y="142" fill="currentColor" stroke="none" font-size="14" font-weight="600" text-anchor="middle">scout@atmark.ai</text>
  <line x1="384" y1="156" x2="688" y2="156" stroke-width="1" opacity=".4"/>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="384" y="184"><tspan font-weight="600">읽기</tspan>  scout@으로 온 메일만</text>
    <text x="384" y="220"><tspan font-weight="600">발신</tspan>  scout@ 주소로, 발신 허용 목록에만</text>
    <text x="384" y="256"><tspan font-weight="600">수신</tspan>  외부 데이터로 표시되어 도착</text>
    <text x="384" y="292"><tspan font-weight="600">기록</tspan>  모든 판정을 해시 체인으로</text>
  </g>
  <rect x="440" y="350" width="192" height="34" rx="6" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>
  <text x="536" y="372" fill="currentColor" stroke="none" font-size="13" text-anchor="middle" opacity=".8">내 메일함: 연결하지 않음</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="fig-f-title fig-f-desc" font-family="inherit" fill="none" stroke="currentColor">
  <title id="fig-f-title">위험한 메일을 읽은 뒤의 발송은 소유자를 기다린다</title>
  <desc id="fig-f-desc">위에서 아래로 다섯 단계. 1, 위험 표시가 붙은 메일이 옵니다. 2, 에이전트가 읽고, 읽은 기록이 남습니다. 3, 에이전트가 메일을 보내려 합니다. 소유자가 주소로 허락해 둔 상대가 아니거나, 비밀번호·API 키·받은 코드·받은 메일 복사가 담겨 있으면 보류됩니다. 4, 보류된 발송이 소유자를 기다립니다. 5, 소유자가 이 한 통만 승인하거나 거부합니다. 승인은 이번 한 번뿐이고, 그 상대가 믿을 만한 곳으로 남지 않습니다.</desc>

  <!-- 단계 상자 -->
  <g stroke-width="1.5">
    <rect x="24" y="16" width="420" height="48" rx="8"/>
    <rect x="24" y="84" width="420" height="48" rx="8"/>
    <rect x="24" y="152" width="420" height="48" rx="8"/>
    <rect x="24" y="220" width="420" height="48" rx="8" stroke-dasharray="6 4"/>
    <rect x="24" y="288" width="420" height="48" rx="8" stroke-width="2.5"/>
  </g>

  <!-- 번호 -->
  <g stroke-width="1.5">
    <circle cx="52" cy="40" r="13"/>
    <circle cx="52" cy="108" r="13"/>
    <circle cx="52" cy="176" r="13"/>
    <circle cx="52" cy="244" r="13"/>
    <circle cx="52" cy="312" r="13"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="13" font-weight="600" text-anchor="middle">
    <text x="52" y="45">1</text>
    <text x="52" y="113">2</text>
    <text x="52" y="181">3</text>
    <text x="52" y="249">4</text>
    <text x="52" y="317">5</text>
  </g>

  <!-- 글 -->
  <g fill="currentColor" stroke="none" font-size="14">
    <text x="80" y="45">위험 표시가 붙은 메일이 온다</text>
    <text x="80" y="113">에이전트가 읽는다 · 읽은 기록이 남는다</text>
    <text x="80" y="181">에이전트가 메일을 보내려 한다</text>
    <text x="80" y="249"><tspan font-weight="600">보류</tspan> · 소유자를 기다린다</text>
    <text x="80" y="317">소유자가 이 한 통만 승인하거나 거부한다</text>
  </g>

  <!-- 화살표 -->
  <g stroke-width="1.5">
    <line x1="234" y1="64" x2="234" y2="82"/><path d="M229 77 L234 83 L239 77"/>
    <line x1="234" y1="132" x2="234" y2="150"/><path d="M229 145 L234 151 L239 145"/>
    <line x1="234" y1="200" x2="234" y2="218"/><path d="M229 213 L234 219 L239 213"/>
    <line x1="234" y1="268" x2="234" y2="286"/><path d="M229 281 L234 287 L239 281"/>
  </g>

  <!-- 3단계 설명 -->
  <line x1="444" y1="176" x2="468" y2="176" stroke-width="1.5"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="476" y="158" font-weight="600">이럴 때 보류된다</text>
    <text x="476" y="174" opacity=".8">주소로 허락해 둔 상대가 아닐 때</text>
    <text x="476" y="190" opacity=".8">키 · 받은 코드가 담겼을 때</text>
    <text x="476" y="206" opacity=".8">받은 메일을 옮겨 붙였을 때</text>
  </g>

  <!-- 5단계 설명 -->
  <line x1="444" y1="312" x2="468" y2="312" stroke-width="1.5"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="476" y="308" font-weight="600">승인은 이번 한 번뿐</text>
    <text x="476" y="324" opacity=".8">상대가 믿을 곳으로 남지 않는다</text>
  </g>
</svg>

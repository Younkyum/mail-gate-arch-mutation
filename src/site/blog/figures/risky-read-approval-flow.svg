<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="fig-f-title fig-f-desc" font-family="inherit" fill="none" stroke="currentColor">
  <title id="fig-f-title">After an agent reads risky mail, a send waits for the owner</title>
  <desc id="fig-f-desc">Five steps from top to bottom. 1, mail with a risk mark arrives. 2, the agent reads it, and the read is recorded. 3, the agent tries to send. The send is held if it goes to someone the owner hasn't approved by address, or if it carries a password, API key, received code, or a copy of received mail. 4, the send is held and waits for the owner. 5, the owner approves this one send or denies it. Approval covers this send only and doesn't make the recipient trusted.</desc>

  <!-- Step boxes: x=24, width=420, height=48, pitch=68 -->
  <g stroke-width="1.5">
    <rect x="24" y="16" width="420" height="48" rx="8"/>
    <rect x="24" y="84" width="420" height="48" rx="8"/>
    <rect x="24" y="152" width="420" height="48" rx="8"/>
    <rect x="24" y="220" width="420" height="48" rx="8" stroke-dasharray="6 4"/>
    <rect x="24" y="288" width="420" height="48" rx="8" stroke-width="2.5"/>
  </g>

  <!-- Number badges -->
  <g stroke-width="1.5">
    <circle cx="52" cy="40" r="13"/>
    <circle cx="52" cy="108" r="13"/>
    <circle cx="52" cy="176" r="13"/>
    <circle cx="52" cy="244" r="13"/>
    <circle cx="52" cy="312" r="13"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="13" font-weight="600" text-anchor="middle">
    <text x="52" y="45">1</text>
    <text x="52" y="113">2</text>
    <text x="52" y="181">3</text>
    <text x="52" y="249">4</text>
    <text x="52" y="317">5</text>
  </g>

  <!-- Labels -->
  <g fill="currentColor" stroke="none" font-size="14">
    <text x="80" y="45">Mail with a risk mark arrives</text>
    <text x="80" y="113">The agent reads it; the read is recorded</text>
    <text x="80" y="181">The agent tries to send</text>
    <text x="80" y="249"><tspan font-weight="600">Held</tspan>: waiting for the owner</text>
    <text x="80" y="317">Owner approves this one send, or denies it</text>
  </g>

  <!-- Down arrows -->
  <g stroke-width="1.5">
    <line x1="234" y1="64" x2="234" y2="82"/><path d="M229 77 L234 83 L239 77"/>
    <line x1="234" y1="132" x2="234" y2="150"/><path d="M229 145 L234 151 L239 145"/>
    <line x1="234" y1="200" x2="234" y2="218"/><path d="M229 213 L234 219 L239 213"/>
    <line x1="234" y1="268" x2="234" y2="286"/><path d="M229 281 L234 287 L239 281"/>
  </g>

  <!-- Note on step 3 -->
  <line x1="444" y1="176" x2="468" y2="176" stroke-width="1.5"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="476" y="158" font-weight="600">Held when it goes to</text>
    <text x="476" y="174" opacity=".8">someone not approved by address,</text>
    <text x="476" y="190" opacity=".8">or carries a key, a received code,</text>
    <text x="476" y="206" opacity=".8">or a copy of received mail</text>
  </g>

  <!-- Note on step 5 -->
  <line x1="444" y1="312" x2="468" y2="312" stroke-width="1.5"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="476" y="308" font-weight="600">Approval is once</text>
    <text x="476" y="324" opacity=".8">The recipient doesn't become trusted</text>
  </g>
</svg>
